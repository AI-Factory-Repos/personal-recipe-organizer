<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe – Recipe Organizer</title>
  <link rel="stylesheet" href="/frontend/css/main.css" />
</head>
<body>
<div id="recipe-detail-root">
  <div style="text-align:center;padding:4rem">
    <span class="spinner" style="border-color:var(--color-border);border-top-color:var(--color-primary);width:36px;height:36px"></span>
  </div>
</div>

<script>
(function() {
  const root = document.getElementById('recipe-detail-root');
  const recipeId = window.__routeParam;

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function diffBadgeClass(diff) {
    if (diff === 'Easy') return 'badge-easy';
    if (diff === 'Hard') return 'badge-hard';
    return 'badge-medium';
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    try {
      return new Date(dateStr).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    } catch (e) {
      return dateStr;
    }
  }

  function renderRecipe(recipe) {
    const ingredients = Array.isArray(recipe.ingredients) ? recipe.ingredients : [];
    root.innerHTML = `
      <div class="page-header">
        <h1>${escHtml(recipe.title)}</h1>
        <div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap">
          <button class="btn btn-secondary" onclick="navigate('/dashboard')">&larr; Back</button>
          <button class="btn btn-primary" onclick="navigate('/edit-recipe/${escHtml(recipe._id)}')">Edit Recipe</button>
          <button class="btn btn-danger" id="delete-btn">Delete</button>
        </div>
      </div>

      <div class="recipe-detail-card">
        <div class="recipe-meta" style="margin-bottom:1.25rem;gap:0.5rem">
          <span class="badge badge-cuisine">${escHtml(recipe.cuisineType)}</span>
          <span class="badge badge-meal">${escHtml(recipe.mealCategory)}</span>
          <span class="badge ${diffBadgeClass(recipe.difficulty)}">${escHtml(recipe.difficulty)}</span>
        </div>

        ${recipe.createdAt ? `<p style="font-size:0.85rem;color:var(--color-text-muted);margin-bottom:1.5rem">Added ${formatDate(recipe.createdAt)}${recipe.updatedAt && recipe.updatedAt !== recipe.createdAt ? ' &middot; Updated ' + formatDate(recipe.updatedAt) : ''}</p>` : ''}

        <section style="margin-bottom:2rem">
          <h2 style="font-size:1.1rem;font-weight:700;color:var(--color-primary);margin-bottom:0.75rem">Ingredients</h2>
          <ul class="ingredients-list">
            ${ingredients.map(ing => `<li>${escHtml(ing)}</li>`).join('')}
          </ul>
        </section>

        <section>
          <h2 style="font-size:1.1rem;font-weight:700;color:var(--color-primary);margin-bottom:0.75rem">Instructions</h2>
          <div class="instructions-block">${escHtml(recipe.instructions).replace(/\n/g, '<br />')}</div>
        </section>
      </div>
    `;

    document.getElementById('delete-btn').addEventListener('click', async function() {
      if (!confirm('Are you sure you want to delete this recipe? This cannot be undone.')) return;
      const token = localStorage.getItem('recipeOrganizerToken');
      try {
        const res = await fetch(`/api/recipes/${recipeId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
        });
        if (res.status === 401) { window.logout(); return; }
        if (res.ok) {
          navigate('/dashboard');
        } else {
          alert('Failed to delete recipe.');
        }
      } catch (err) {
        console.error(err);
        alert('Failed to delete recipe.');
      }
    });
  }

  function renderNotFound() {
    root.innerHTML = `
      <div class="page-header">
        <h1>Recipe Not Found</h1>
        <button class="btn btn-secondary" onclick="navigate('/dashboard')">&larr; Back to Recipes</button>
      </div>
      <div class="empty-state">
        <p>This recipe could not be found or you do not have permission to view it.</p>
        <button class="btn btn-primary" onclick="navigate('/dashboard')">Go to My Recipes</button>
      </div>
    `;
  }

  async function loadRecipe() {
    if (!recipeId) { renderNotFound(); return; }
    const token = localStorage.getItem('recipeOrganizerToken');
    if (!token) { window.location.hash = '/login'; return; }

    try {
      const res = await fetch('/api/recipes', {
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
      });
      if (res.status === 401) { window.logout(); return; }
      if (!res.ok) throw new Error('Server error: ' + res.status);
      const data = await res.json();
      const recipes = data.recipes || [];
      const recipe = recipes.find(r => r._id === recipeId);
      if (!recipe) {
        renderNotFound();
        return;
      }
      renderRecipe(recipe);
    } catch (err) {
      console.error(err);
      root.innerHTML = `<p class="alert alert-error" style="margin:2rem 0">Failed to load recipe. Please <a href="#/dashboard">go back</a> and try again.</p>`;
    }
  }

  loadRecipe();
})();
</script>
</body>
</html>
