<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe – Recipe Organizer</title>
  <link rel="stylesheet" href="/frontend/css/main.css" />
  <style>
    .recipe-detail-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow);
      max-width: 780px;
    }
    .recipe-detail-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: 0.75rem;
    }
    .recipe-detail-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .recipe-section-label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      margin-bottom: 0.5rem;
    }
    .recipe-section {
      margin-bottom: 1.5rem;
    }
    .recipe-ingredients-list {
      list-style: disc;
      padding-left: 1.4rem;
      line-height: 1.8;
    }
    .recipe-instructions {
      white-space: pre-wrap;
      line-height: 1.8;
      color: var(--color-text);
    }
    .recipe-detail-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--color-border);
    }
  </style>
</head>
<body>
<div class="page-header">
  <h1>Recipe Detail</h1>
  <button class="btn btn-secondary" onclick="navigate('/dashboard')">&larr; Back</button>
</div>

<div id="detail-container">
  <div style="text-align:center;padding:3rem"><span class="spinner" style="border-color:var(--color-border);border-top-color:var(--color-primary);width:32px;height:32px"></span></div>
</div>

<script>
(function() {
  const recipeId  = window.__routeParam;
  const container = document.getElementById('detail-container');

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function showError(msg) {
    container.innerHTML = `<div class="alert alert-error">${escHtml(msg)}</div>`;
  }

  async function loadRecipe() {
    if (!recipeId) {
      showError('No recipe ID provided.');
      return;
    }
    try {
      const res  = await authFetch('/api/recipes');
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Failed to load recipe.');

      const recipe = (data.recipes || []).find(function(r) {
        return (r.id || r._id) === recipeId;
      });

      if (!recipe) {
        showError('Recipe not found.');
        return;
      }

      renderRecipe(recipe);
    } catch (err) {
      if (err.message !== 'Session expired. Please log in again.') {
        showError(err.message);
      }
    }
  }

  function renderRecipe(r) {
    const ingredients = Array.isArray(r.ingredients) ? r.ingredients : [];
    const id = r.id || r._id;

    container.innerHTML = `
      <div class="recipe-detail-card">
        <h2 class="recipe-detail-title">${escHtml(r.title)}</h2>
        <div class="recipe-detail-badges">
          <span class="badge badge-cuisine">${escHtml(r.cuisineType)}</span>
          <span class="badge badge-meal">${escHtml(r.mealCategory)}</span>
          <span class="badge badge-difficulty badge-difficulty--${(r.difficulty||'').toLowerCase()}">${escHtml(r.difficulty)}</span>
        </div>
        <div class="recipe-section">
          <p class="recipe-section-label">Ingredients</p>
          <ul class="recipe-ingredients-list">
            ${ingredients.map(function(ing) { return `<li>${escHtml(ing)}</li>`; }).join('')}
          </ul>
        </div>
        <div class="recipe-section">
          <p class="recipe-section-label">Instructions</p>
          <p class="recipe-instructions">${escHtml(r.instructions)}</p>
        </div>
        <div class="recipe-detail-actions">
          <button class="btn btn-primary" onclick="navigate('/edit-recipe/${escHtml(id)}')">Edit Recipe</button>
          <button class="btn btn-danger"  onclick="deleteRecipe('${escHtml(id)}')">Delete Recipe</button>
          <button class="btn btn-secondary" onclick="navigate('/dashboard')">Back to Dashboard</button>
        </div>
      </div>`;
  }

  window.deleteRecipe = async function(id) {
    if (!confirm('Delete this recipe? This cannot be undone.')) return;
    try {
      const res = await authFetch('/api/recipes/' + id, { method: 'DELETE' });
      if (!res.ok) {
        const data = await res.json();
        throw new Error(data.message || 'Delete failed.');
      }
      navigate('/dashboard');
    } catch (err) {
      if (err.message !== 'Session expired. Please log in again.') {
        alert(err.message);
      }
    }
  };

  loadRecipe();
})();
</script>
</body>
</html>
