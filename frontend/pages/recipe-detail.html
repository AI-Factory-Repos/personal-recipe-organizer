<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe – Recipe Organizer</title>
  <link rel="stylesheet" href="/frontend/css/main.css" />
</head>
<body>
<div class="page-header">
  <h1 id="detail-title">Recipe</h1>
  <button class="btn btn-secondary" onclick="navigate('/dashboard')">&larr; Back</button>
</div>

<div id="detail-container">
  <div style="text-align:center;padding:3rem">
    <span class="spinner" style="border-color:var(--color-border);border-top-color:var(--color-primary);width:32px;height:32px"></span>
  </div>
</div>

<script>
(function() {
  const recipeId = window.__routeParam;
  const container = document.getElementById('detail-container');
  const titleEl = document.getElementById('detail-title');

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function diffBadgeClass(diff) {
    if (diff === 'Easy') return 'badge-easy';
    if (diff === 'Hard') return 'badge-hard';
    return 'badge-medium';
  }

  function renderRecipe(recipe) {
    titleEl.textContent = recipe.title;
    const ingredients = Array.isArray(recipe.ingredients) ? recipe.ingredients : [];
    container.innerHTML = `
      <div class="recipe-detail-card">
        <div class="recipe-detail-meta">
          <span class="badge badge-cuisine">${escHtml(recipe.cuisineType)}</span>
          <span class="badge badge-meal">${escHtml(recipe.mealCategory)}</span>
          <span class="badge ${diffBadgeClass(recipe.difficulty)}">${escHtml(recipe.difficulty)}</span>
        </div>

        <section class="recipe-detail-section">
          <h2>Ingredients</h2>
          <ul class="ingredients-list">
            ${ingredients.map(ing => `<li>${escHtml(ing)}</li>`).join('')}
          </ul>
        </section>

        <section class="recipe-detail-section">
          <h2>Instructions</h2>
          <div class="instructions-text">${escHtml(recipe.instructions).replace(/\n/g, '<br />')}</div>
        </section>

        <div class="recipe-detail-actions">
          <button class="btn btn-primary" onclick="navigate('/edit-recipe/${escHtml(recipe._id)}')">Edit Recipe</button>
          <button class="btn btn-danger" id="delete-btn">Delete Recipe</button>
        </div>
      </div>`;

    document.getElementById('delete-btn').addEventListener('click', async function() {
      if (!confirm('Are you sure you want to delete this recipe?')) return;
      const token = localStorage.getItem('recipeOrganizerToken');
      try {
        const res = await fetch(`/api/recipes/${recipe._id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });
        if (res.status === 401) { window.logout(); return; }
        if (res.ok) {
          navigate('/dashboard');
        } else {
          alert('Failed to delete recipe.');
        }
      } catch (err) {
        console.error(err);
        alert('Failed to delete recipe.');
      }
    });
  }

  async function loadRecipe() {
    if (!recipeId) {
      container.innerHTML = '<p class="alert alert-error">Recipe not found.</p>';
      return;
    }

    const token = localStorage.getItem('recipeOrganizerToken');
    if (!token) { window.location.hash = '/login'; return; }

    try {
      const res = await fetch('/api/recipes', {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });
      if (res.status === 401) { window.logout(); return; }
      if (!res.ok) throw new Error('Server error: ' + res.status);
      const data = await res.json();
      const recipes = data.recipes || [];
      const recipe = recipes.find(r => r._id === recipeId);
      if (!recipe) {
        container.innerHTML = '<p class="alert alert-error">Recipe not found.</p>';
        return;
      }
      renderRecipe(recipe);
    } catch (err) {
      container.innerHTML = '<p class="alert alert-error">Failed to load recipe. Please try again.</p>';
      console.error(err);
    }
  }

  loadRecipe();
})();
</script>

<style>
.recipe-detail-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 2rem;
  box-shadow: var(--shadow);
  max-width: 760px;
}

.recipe-detail-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1.75rem;
}

.recipe-detail-section {
  margin-bottom: 1.75rem;
}

.recipe-detail-section h2 {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--color-primary);
  margin-bottom: 0.75rem;
  border-bottom: 1px solid var(--color-border);
  padding-bottom: 0.4rem;
}

.ingredients-list {
  list-style: disc;
  padding-left: 1.5rem;
  line-height: 1.8;
  color: var(--color-text);
}

.instructions-text {
  line-height: 1.8;
  color: var(--color-text);
  white-space: pre-wrap;
}

.recipe-detail-actions {
  display: flex;
  gap: 1rem;
  margin-top: 1rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--color-border);
}
</style>
</body>
</html>
