<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Recipe Organizer</title>
  <link rel="stylesheet" href="/frontend/css/main.css" />
</head>
<body>
<div class="auth-container">
  <h1>Welcome back</h1>
  <p class="auth-subtitle">Sign in to manage your recipes</p>

  <div id="login-alert" class="alert alert-error" style="display:none"></div>

  <form id="login-form" novalidate>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
    </div>
    <button type="submit" class="btn btn-primary btn-full" id="login-btn">Sign In</button>
  </form>

  <p style="margin-top:1.25rem;font-size:0.9rem;text-align:center;color:var(--color-text-muted)">
    Don't have an account? <a href="#/register">Register</a>
  </p>
</div>

<script>
(function() {
  const form = document.getElementById('login-form');
  const alertEl = document.getElementById('login-alert');
  const btn = document.getElementById('login-btn');

  function showError(msg) {
    alertEl.textContent = msg;
    alertEl.style.display = 'block';
    alertEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function hideError() {
    alertEl.style.display = 'none';
  }

  function validate(email, password) {
    if (!email) return 'Email is required.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return 'Please enter a valid email address.';
    if (!password) return 'Password is required.';
    return null;
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    hideError();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const validationError = validate(email, password);
    if (validationError) {
      showError(validationError);
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in…';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Login failed. Please check your credentials.');

      localStorage.setItem('recipeOrganizerToken', data.token);
      localStorage.setItem('recipeOrganizerUser', JSON.stringify(data.user));
      window.location.hash = '/dashboard';
    } catch (err) {
      showError(err.message);
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
})();
</script>
</body>
</html>
