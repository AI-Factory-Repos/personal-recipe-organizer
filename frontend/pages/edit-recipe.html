<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Recipe – Recipe Organizer</title>
  <link rel="stylesheet" href="/frontend/css/main.css" />
</head>
<body>
<div class="page-header">
  <h1>Edit Recipe</h1>
  <button class="btn btn-secondary" onclick="navigate('/dashboard')">&larr; Back</button>
</div>

<div class="form-card">
  <div id="form-alert" class="alert alert-error" style="display:none"></div>
  <div id="edit-form-wrapper">
    <div style="text-align:center;padding:3rem"><span class="spinner" style="border-color:var(--color-border);border-top-color:var(--color-primary);width:32px;height:32px"></span></div>
  </div>
</div>

<script>
(function() {
  const recipeId = window.__routeParam;
  const wrapper  = document.getElementById('edit-form-wrapper');
  const alertEl  = document.getElementById('form-alert');

  function showError(msg) {
    alertEl.textContent = msg;
    alertEl.className = 'alert alert-error';
    alertEl.style.display = 'block';
    alertEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function showSuccess(msg) {
    alertEl.textContent = msg;
    alertEl.className = 'alert alert-success';
    alertEl.style.display = 'block';
    alertEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function hideAlert() {
    alertEl.style.display = 'none';
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function addIngredientRow(list, value) {
    var row = document.createElement('div');
    row.className = 'ingredient-row';
    row.innerHTML =
      '<input type="text" placeholder="e.g. 1 tsp salt" />' +
      '<button type="button" class="btn btn-secondary remove-ing" aria-label="Remove ingredient">&#x2715;</button>';
    if (value) row.querySelector('input').value = value;
    row.querySelector('.remove-ing').addEventListener('click', function() {
      row.remove();
      updateRemoveButtons(list);
    });
    list.appendChild(row);
    updateRemoveButtons(list);
    return row;
  }

  function updateRemoveButtons(list) {
    var rows = list.querySelectorAll('.ingredient-row');
    rows.forEach(function(row) {
      row.querySelector('.remove-ing').style.display = rows.length > 1 ? 'inline-flex' : 'none';
    });
  }

  function renderForm(recipe) {
    wrapper.innerHTML = `
      <form id="edit-recipe-form">
        <div class="form-group">
          <label for="title">Title <span style="color:var(--color-danger)">*</span></label>
          <input type="text" id="title" value="${escHtml(recipe.title)}" required />
        </div>
        <div class="form-group">
          <label>Ingredients <span style="color:var(--color-danger)">*</span></label>
          <div id="ingredients-list"></div>
          <button type="button" class="btn btn-secondary" id="add-ingredient" style="margin-top:0.5rem">+ Add Ingredient</button>
        </div>
        <div class="form-group">
          <label for="instructions">Instructions <span style="color:var(--color-danger)">*</span></label>
          <textarea id="instructions" rows="6" required></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="cuisineType">Cuisine Type <span style="color:var(--color-danger)">*</span></label>
            <select id="cuisineType" required>
              <option value="">Select cuisine&hellip;</option>
              <option>Italian</option><option>Mexican</option><option>Chinese</option>
              <option>Indian</option><option>American</option><option>French</option>
              <option>Japanese</option><option>Mediterranean</option><option>Thai</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="mealCategory">Meal Category <span style="color:var(--color-danger)">*</span></label>
            <select id="mealCategory" required>
              <option value="">Select category&hellip;</option>
              <option>Breakfast</option><option>Lunch</option><option>Dinner</option>
              <option>Snack</option><option>Dessert</option><option>Appetizer</option>
              <option>Beverage</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="difficulty">Difficulty <span style="color:var(--color-danger)">*</span></label>
          <select id="difficulty" required>
            <option value="">Select difficulty&hellip;</option>
            <option>Easy</option><option>Medium</option><option>Hard</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Update Recipe</button>
          <button type="button" class="btn btn-secondary" onclick="navigate('/dashboard')">Cancel</button>
        </div>
      </form>`;

    // Populate instructions
    document.getElementById('instructions').value = recipe.instructions || '';

    // Populate selects
    ['cuisineType', 'mealCategory', 'difficulty'].forEach(function(field) {
      var sel = document.getElementById(field);
      for (var i = 0; i < sel.options.length; i++) {
        if (sel.options[i].value === recipe[field]) {
          sel.selectedIndex = i;
          break;
        }
      }
    });

    // Populate ingredients
    var ingList     = document.getElementById('ingredients-list');
    var ingredients = Array.isArray(recipe.ingredients) ? recipe.ingredients : [];
    if (ingredients.length) {
      ingredients.forEach(function(ing) { addIngredientRow(ingList, ing); });
    } else {
      addIngredientRow(ingList, '');
    }
    updateRemoveButtons(ingList);

    // Add ingredient button
    document.getElementById('add-ingredient').addEventListener('click', function() {
      var row = addIngredientRow(ingList, '');
      row.querySelector('input').focus();
    });

    // Submit
    document.getElementById('edit-recipe-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideAlert();

      var ingInputs = ingList.querySelectorAll('.ingredient-row input');
      var ingredients = Array.from(ingInputs)
        .map(function(i) { return i.value.trim(); })
        .filter(Boolean);

      var fields = {
        title:        document.getElementById('title').value.trim(),
        ingredients:  ingredients,
        instructions: document.getElementById('instructions').value.trim(),
        cuisineType:  document.getElementById('cuisineType').value,
        mealCategory: document.getElementById('mealCategory').value,
        difficulty:   document.getElementById('difficulty').value,
      };

      if (!fields.title)               { showError('Recipe title is required.');       return; }
      if (!fields.ingredients.length)  { showError('Add at least one ingredient.');    return; }
      if (!fields.instructions)        { showError('Instructions are required.');      return; }
      if (!fields.cuisineType)         { showError('Please select a cuisine type.');   return; }
      if (!fields.mealCategory)        { showError('Please select a meal category.'); return; }
      if (!fields.difficulty)          { showError('Please select a difficulty.');     return; }

      var submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Saving…';

      try {
        const res = await authFetch('/api/recipes/' + recipeId, {
          method: 'PUT',
          body: JSON.stringify(fields),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed to update recipe.');
        showSuccess('Recipe updated successfully!');
        setTimeout(function() { navigate('/dashboard'); }, 1200);
      } catch (err) {
        if (err.message !== 'Session expired. Please log in again.') {
          showError(err.message);
        }
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Recipe';
      }
    });
  }

  /* ── Load recipe ── */
  async function loadRecipe() {
    if (!recipeId) {
      wrapper.innerHTML = '<div class="alert alert-error">No recipe ID provided.</div>';
      return;
    }
    try {
      const res  = await authFetch('/api/recipes');
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Failed to load recipe.');

      const recipe = (data.recipes || []).find(function(r) {
        return (r.id || r._id) === recipeId;
      });

      if (!recipe) {
        wrapper.innerHTML = '<div class="alert alert-error">Recipe not found.</div>';
        return;
      }
      renderForm(recipe);
    } catch (err) {
      if (err.message !== 'Session expired. Please log in again.') {
        wrapper.innerHTML = `<div class="alert alert-error">${escHtml(err.message)}</div>`;
      }
    }
  }

  loadRecipe();
})();
</script>
</body>
</html>
