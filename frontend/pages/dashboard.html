<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Recipes – Recipe Organizer</title>
  <link rel="stylesheet" href="/frontend/css/main.css" />
  <style>
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0.75rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }

    .filter-bar .form-group {
      margin-bottom: 0;
      min-width: 140px;
      flex: 1 1 140px;
    }

    .filter-bar .form-group label {
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .filter-bar .form-group select {
      padding: 0.45rem 0.7rem;
      font-size: 0.9rem;
    }

    .filter-bar .filter-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-bottom: 0;
      flex-shrink: 0;
    }

    .filter-active-indicator {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1rem;
      align-items: center;
      min-height: 1.6rem;
    }

    .filter-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--color-primary);
      color: #fff;
      border-radius: 999px;
      padding: 0.2rem 0.65rem 0.2rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .filter-tag button {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 0.85rem;
      line-height: 1;
      padding: 0;
      opacity: 0.8;
    }
    .filter-tag button:hover { opacity: 1; }

    .filter-results-count {
      font-size: 0.88rem;
      color: var(--color-text-muted);
      margin-left: auto;
    }

    .select--active {
      border-color: var(--color-primary) !important;
      box-shadow: 0 0 0 2px rgba(224, 123, 57, 0.18);
    }
  </style>
</head>
<body>
<div class="dashboard-header">
  <h1>My Recipes</h1>
  <a href="#/create-recipe" class="btn btn-primary">+ New Recipe</a>
</div>

<!-- Filter Bar -->
<div class="filter-bar">
  <div class="form-group">
    <label for="filter-cuisine">Cuisine</label>
    <select id="filter-cuisine">
      <option value="">All Cuisines</option>
      <option>Italian</option><option>Mexican</option><option>Chinese</option>
      <option>Indian</option><option>American</option><option>French</option>
      <option>Japanese</option><option>Mediterranean</option><option>Thai</option>
      <option>Other</option>
    </select>
  </div>
  <div class="form-group">
    <label for="filter-meal">Meal Category</label>
    <select id="filter-meal">
      <option value="">All Categories</option>
      <option>Breakfast</option><option>Lunch</option><option>Dinner</option>
      <option>Snack</option><option>Dessert</option><option>Appetizer</option>
      <option>Beverage</option>
    </select>
  </div>
  <div class="form-group">
    <label for="filter-difficulty">Difficulty</label>
    <select id="filter-difficulty">
      <option value="">All Difficulties</option>
      <option>Easy</option><option>Medium</option><option>Hard</option>
    </select>
  </div>
  <div class="form-group">
    <label for="sort-by">Sort By</label>
    <select id="sort-by">
      <option value="date-desc">Newest First</option>
      <option value="date-asc">Oldest First</option>
      <option value="title-asc">Title A–Z</option>
      <option value="title-desc">Title Z–A</option>
    </select>
  </div>
  <div class="filter-actions">
    <button class="btn btn-secondary" id="clear-btn">Clear Filters</button>
  </div>
</div>

<!-- Active filter tags + result count -->
<div class="filter-active-indicator" id="filter-tags"></div>

<div id="recipes-container">
  <div style="text-align:center;padding:3rem"><span class="spinner" style="border-color:var(--color-border);border-top-color:var(--color-primary);width:32px;height:32px"></span></div>
</div>

<script>
(function() {
  const cuisineEl    = document.getElementById('filter-cuisine');
  const mealEl       = document.getElementById('filter-meal');
  const diffEl       = document.getElementById('filter-difficulty');
  const sortEl       = document.getElementById('sort-by');
  const clearBtn     = document.getElementById('clear-btn');
  const container    = document.getElementById('recipes-container');
  const tagsEl       = document.getElementById('filter-tags');

  let allRecipes = [];

  /* ── Fetch recipes ── */
  async function fetchRecipes() {
    try {
      const res = await authFetch('/api/recipes');
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Failed to load recipes.');
      allRecipes = data.recipes || [];
      applyFilters();
    } catch (err) {
      // authFetch already handles 401/logout; show message for other errors
      if (err.message !== 'Session expired. Please log in again.') {
        container.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }
  }

  /* ── Filtering & Sorting ── */
  function applyFilters() {
    const cuisine    = cuisineEl.value;
    const meal       = mealEl.value;
    const difficulty = diffEl.value;
    const sort       = sortEl.value;

    // Toggle active styling on selects
    [cuisineEl, mealEl, diffEl].forEach(function(el) {
      el.classList.toggle('select--active', !!el.value);
    });

    let filtered = allRecipes.filter(function(r) {
      if (cuisine    && r.cuisineType    !== cuisine)    return false;
      if (meal       && r.mealCategory   !== meal)       return false;
      if (difficulty && r.difficulty     !== difficulty) return false;
      return true;
    });

    // Sort
    filtered = filtered.slice().sort(function(a, b) {
      if (sort === 'title-asc')  return a.title.localeCompare(b.title);
      if (sort === 'title-desc') return b.title.localeCompare(a.title);
      if (sort === 'date-asc')   return new Date(a.createdAt) - new Date(b.createdAt);
      // date-desc default
      return new Date(b.createdAt) - new Date(a.createdAt);
    });

    renderTags(cuisine, meal, difficulty, filtered.length);
    renderRecipes(filtered);
  }

  /* ── Filter Tags ── */
  function renderTags(cuisine, meal, difficulty, count) {
    tagsEl.innerHTML = '';
    function addTag(label, clearFn) {
      const tag = document.createElement('span');
      tag.className = 'filter-tag';
      tag.innerHTML = `${label} <button aria-label="Remove filter" title="Remove">&#x2715;</button>`;
      tag.querySelector('button').addEventListener('click', clearFn);
      tagsEl.appendChild(tag);
    }
    if (cuisine)    addTag(cuisine,    function() { cuisineEl.value = ''; applyFilters(); });
    if (meal)       addTag(meal,       function() { mealEl.value    = ''; applyFilters(); });
    if (difficulty) addTag(difficulty, function() { diffEl.value    = ''; applyFilters(); });

    const countEl = document.createElement('span');
    countEl.className = 'filter-results-count';
    countEl.textContent = `${count} recipe${count !== 1 ? 's' : ''}`;
    tagsEl.appendChild(countEl);
  }

  /* ── Render recipe cards ── */
  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderRecipes(recipes) {
    if (!recipes.length) {
      container.innerHTML = `
        <div class="empty-state">
          <p>No recipes found.</p>
          <a href="#/create-recipe" class="btn btn-primary" style="margin-top:1rem">+ Add your first recipe</a>
        </div>`;
      return;
    }

    container.innerHTML = `<div class="recipe-grid">${recipes.map(function(r) {
      return `
        <div class="recipe-card" onclick="navigate('/recipe/${escHtml(r.id || r._id)}')" style="cursor:pointer">
          <div class="recipe-card-header">
            <h3 class="recipe-card-title">${escHtml(r.title)}</h3>
            <div class="recipe-card-meta">
              <span class="badge badge-cuisine">${escHtml(r.cuisineType)}</span>
              <span class="badge badge-meal">${escHtml(r.mealCategory)}</span>
              <span class="badge badge-difficulty badge-difficulty--${(r.difficulty||'').toLowerCase()}">${escHtml(r.difficulty)}</span>
            </div>
          </div>
          <div class="recipe-card-actions">
            <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();navigate('/edit-recipe/${escHtml(r.id || r._id)}')">Edit</button>
            <button class="btn btn-danger  btn-sm" onclick="event.stopPropagation();deleteRecipe('${escHtml(r.id || r._id)}')">Delete</button>
          </div>
        </div>`;
    }).join('')}</div>`;
  }

  /* ── Delete ── */
  window.deleteRecipe = async function(id) {
    if (!confirm('Delete this recipe? This cannot be undone.')) return;
    try {
      const res = await authFetch('/api/recipes/' + id, { method: 'DELETE' });
      if (!res.ok) {
        const data = await res.json();
        throw new Error(data.message || 'Delete failed.');
      }
      allRecipes = allRecipes.filter(function(r) { return (r.id || r._id) !== id; });
      applyFilters();
    } catch (err) {
      if (err.message !== 'Session expired. Please log in again.') {
        alert(err.message);
      }
    }
  };

  /* ── Event listeners ── */
  [cuisineEl, mealEl, diffEl, sortEl].forEach(function(el) {
    el.addEventListener('change', applyFilters);
  });

  clearBtn.addEventListener('click', function() {
    cuisineEl.value = '';
    mealEl.value    = '';
    diffEl.value    = '';
    applyFilters();
  });

  /* ── Init ── */
  fetchRecipes();
})();
</script>
</body>
</html>
